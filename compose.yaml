name: transcribe-service

x-app: &app
  build: .
  image: transcribe-service:local
  env_file: ${ENV_FILE:-.env}
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-transcriber}:${POSTGRES_PASSWORD:-local-development}@db:5432/${POSTGRES_DB:-transcriber}
    MEDIA_DIR: /data
    MODEL_CACHE_DIR: /models
    SERVER_HOST: 0.0.0.0
  volumes:
    - media:/data
    - models:/models
  init: true
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcriber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development}
      POSTGRES_DB: ${POSTGRES_DB:-transcriber}
    ports: ["127.0.0.1:${DB_PORT:-55432}:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  schema:
    <<: *app
    command: ["python", "-m", "src.database"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    command: ["python", "main.py"]
    ports: ["127.0.0.1:${APP_PORT:-8000}:${SERVER_PORT:-8000}"]
    mem_limit: ${API_MEMORY_LIMIT:-4g}
    cpus: ${API_CPU_LIMIT:-4}
    stop_grace_period: 30s
    depends_on:
      schema: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; from src.settings.config import settings; urllib.request.urlopen(f'http://127.0.0.1:{settings.server_port}/health/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres:
  media:
  models:
